# Envanter — Nginx alt klasör (/envanter) yapılandırması
#
# aaPanel'de: Website → ernsaha.com.tr → Config (Yapılandırma) →
# server { ... } bloğunun İÇİNE aşağıdaki location bloklarını ekle → Save.
#
# NASIL ÇALIŞIR
#   Uygulama --root-path /envanter ile başlatılır. Bu ayar yalnızca uygulamanın
#   ÜRETTİĞİ adreslere ön ek ekler; uygulamanın kendi yolları hâlâ /ui/, /assets
#   şeklindedir. Bu yüzden Nginx, isteği iletmeden ÖNCE /envanter ön ekini
#   KIRPMALIDIR:
#       /envanter/ui/  →  (rewrite)  →  /ui/  → uygulama
#   Kırpılmazsa uygulama /envanter/ui/ yolunu tanımaz ve 404 döner.
#
#   Kırpma işi `rewrite ... break` ile yapılır. (proxy_pass sonuna "/" koymak
#   da prefix location'da aynı işi görür, ancak regex location'da geçersizdir;
#   bu yüzden her iki blokta da aynı yöntem kullanılır.)

location /envanter {
    rewrite ^/envanter/?(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8901;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /envanter;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Fatura görselleri ve CSV yüklemeleri için (uygulama sınırı 10 MB)
    client_max_body_size 12m;

    # AI ile fatura okuma uzun sürebilir
    proxy_connect_timeout 30s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    proxy_buffering off;
}

# aaPanel'in statik dosya kuralları (örn. `location ~ .*\.(png|jpg)$`) regex
# olduğu için yukarıdaki prefix bloğundan ÖNCE eşleşir ve QR kodu / etiket
# PDF'i gibi üretilen dosyaları dosya sisteminde arayıp 404 döndürür.
# Bu blok, /envanter altındaki bu uzantıların da vekile gitmesini garantiler.
location ~ ^/envanter/.*\.(pdf|png|csv|jpg|jpeg|gif|svg|ico)$ {
    rewrite ^/envanter/?(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8901;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /envanter;
    proxy_read_timeout 180s;
}
