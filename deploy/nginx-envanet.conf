# Envanter — Nginx alt klasör (/envanet) yapılandırması
#
# aaPanel'de: Website → ernsaha.com.tr → Config (Yapılandırma) →
# server { ... } bloğunun İÇİNE aşağıdaki location bloklarını ekle,
# sonra "Save" de. aaPanel yapılandırmayı otomatik test edip yeniler.
#
# NOT: proxy_pass satırının sonunda "/" YOKTUR. Bu bilinçlidir:
#   - Sonunda / olsaydı Nginx /envanet ön ekini kırpardı ve uygulama
#     yolları yanlış çözerdi.
#   - Ön ek uygulamaya olduğu gibi iletilir; uygulama --root-path /envanet
#     ile başlatıldığı için doğru çalışır.

location /envanet {
    proxy_pass http://127.0.0.1:8901;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /envanet;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Fatura görselleri ve CSV yüklemeleri için (uygulama sınırı 10 MB)
    client_max_body_size 12m;

    # AI ile fatura okuma uzun sürebilir
    proxy_connect_timeout 30s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    proxy_buffering off;
}

# aaPanel bazı kurulumlarda statik dosya kurallarını /envanet yoluna da
# uygular; bu blok PDF/PNG üretimlerinin vekile gitmesini garantiler.
location ~ ^/envanet/.*\.(pdf|png|csv)$ {
    proxy_pass http://127.0.0.1:8901;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}
