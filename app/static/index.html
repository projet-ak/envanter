<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Envanter Takip Sistemi</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />
  <link rel="stylesheet" href="stil.css" />
</head>
<body>
  <div id="kabuk">
    <!-- Sol menü -->
    <aside id="yanmenu">
      <div class="yan-bas">
        <div class="logo" id="markaLogo">📦</div>
        <div>
          <b>Envanter</b>
          <span>Takip Sistemi</span>
        </div>
      </div>
      <nav class="yan-gez" id="gez"></nav>
      <div class="yan-alt">
        <div class="avatar" id="yanAvatar">—</div>
        <div class="ad">
          <b id="yanAd">—</b>
          <span id="yanRol">—</span>
        </div>
        <button class="cik" onclick="logout()" title="Çıkış">⏻</button>
      </div>
    </aside>

    <!-- Sağ taraf -->
    <div id="icerik">
      <header id="ustbar">
        <button id="menuDug" class="ghost" onclick="menuAcKapa()" title="Menü">☰</button>
        <div id="hizliKutu">
          <input id="hizliAra" autocomplete="off"
                 placeholder="🔎 İsim, cihaz no, seri no, şantiye…"
                 oninput="hizliAra()" onfocus="hizliAra()"
                 onkeydown="if(event.key==='Escape')hizliKapat()" />
          <div id="hizliSonuc" class="hidden"></div>
        </div>
        <div class="ust-sag">
          <span class="sayac" id="oturumSayac" title="Oturum süresi">🕐 —</span>
          <button class="tema-dug" id="temaDug" onclick="temaDegistir()"
                  title="Koyu / açık tema">🌙</button>
          <div class="kul-cip" onclick="selectTab('ayarlar')" title="Kullanıcı ayarları">
            <div class="avatar" id="ustAvatar">—</div>
            <div class="ad">
              <b id="ustAd">—</b>
              <span id="ustRol">—</span>
            </div>
          </div>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <script src="uygulama.js"></script>
</body>
</html>
